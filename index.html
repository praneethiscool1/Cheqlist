<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cheqlist</title>
  <script>
    /* Apply the saved light/dark choice before the page paints, so there is no flash. */
    try { var t = localStorage.getItem('todo-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>

  <!-- Makes the page installable as an app -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3b6cf6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cheqlist">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="hero">
    <div class="hero-text">
      <p class="sr-only">Cheqlist</p>
      <h1 id="hero-day" class="hero-day">Cheqlist</h1>
      <p id="hero-date" class="hero-date"></p>
    </div>
    <div id="theme-switch" class="theme-switch" role="group" aria-label="Colour theme">
      <button type="button" data-theme-choice="auto" title="Match my phone" aria-label="Match my phone" aria-pressed="true"></button>
      <button type="button" data-theme-choice="light" title="Light" aria-label="Light" aria-pressed="false"></button>
      <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark" aria-pressed="false"></button>
    </div>
  </header>

  <div id="reminders" class="reminders" aria-live="polite"></div>

  <form id="add-form" class="add-form" autocomplete="off">
    <div class="add-row">
      <input id="task-input" type="text" placeholder="Add a task…" maxlength="200" aria-label="New task">
      <button type="submit" class="add-btn">Add</button>
    </div>
    <textarea id="new-desc" class="desc-input" rows="3" maxlength="1000" placeholder="Description (optional)" aria-label="New task description" hidden></textarea>
    <div class="add-options">
      <!-- Date and reminder buttons are drawn by script.js. Both are optional. -->
      <span id="draft-pills" class="pills"></span>
      <div class="option">
        <span class="option-label">Priority</span>
        <span id="new-color-slot"></span>
      </div>
    </div>
  </form>

  <div id="notify-bar" class="notify-bar" aria-live="polite"></div>

  <div id="task-list" class="days"></div>
  <div id="empty" class="empty" hidden>
    <svg viewBox="0 0 120 96" fill="none" aria-hidden="true">
      <rect x="22" y="8" width="76" height="80" rx="14" fill="var(--sheet)" stroke="var(--line)" stroke-width="2"/>
      <rect x="34" y="24" width="16" height="16" rx="5" stroke="var(--muted)" stroke-width="2.5" opacity="0.6"/>
      <path d="M58 32h28" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <rect x="34" y="52" width="16" height="16" rx="5" fill="var(--accent)"/>
      <path d="M38 60.5l3.4 3.4 6-6.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M58 60h20" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <p class="empty-title">Nothing planned yet</p>
    <p class="empty-text">Type a task above and tap Add. Give it a date or a reminder if it needs one.</p>
  </div>

  <details class="backup">
    <summary>Backup and restore</summary>
    <p class="note">Copy your tasks as text to keep them safe or to move them to another app or phone, and paste them back here to restore.</p>
    <div class="backup-row">
      <button type="button" id="backup-copy" class="notify-btn">Copy backup</button>
      <button type="button" id="backup-restore" class="notify-btn">Restore from pasted backup</button>
    </div>
    <textarea id="backup-text" class="desc-input" rows="4" placeholder="Paste a backup here to restore" aria-label="Backup text"></textarea>
    <div id="backup-confirm" class="banner warn" hidden>
      <span id="backup-confirm-text"></span>
      <button type="button" id="backup-confirm-yes">Replace</button>
      <button type="button" id="backup-confirm-no">Cancel</button>
    </div>
    <p id="backup-msg" class="backup-msg" aria-live="polite"></p>
    <p id="app-version" class="note" hidden></p>
  </details>
</main>

<script src="sortable.min.js"></script>
<script src="script.js"></script>
</body>
</html>
